<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Sirkeci Kebap gelir ve gider takip portalı">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="/static/style.css?v=2">
<script>
  /* tema tercihini ilk boyamadan önce uygula (yanıp sönmeyi önler) */
  try {
    var t = localStorage.getItem('tema');
    if (t === 'acik') document.documentElement.dataset.theme = 'light';
    else if (t === 'koyu') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
</head>
<body>
<div id="app" class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="icerik"><div class="empty">Yükleniyor…</div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Ana menü"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/static/charts.js?v=2"></script>

</body>
</html>
